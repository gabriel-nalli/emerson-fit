<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:transparent}
.stage{position:relative;width:764px;height:1046px;overflow:hidden}
.phone{position:absolute;width:352px;height:752px;border-radius:60px;background:#1a1a1c;box-shadow:0 30px 60px rgba(0,0,0,.6),inset 0 0 0 3px #3a3a3e,inset 0 0 0 6px #0b0b0c;}
.phone::before{content:"";position:absolute;inset:0;border-radius:52px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.screen{position:absolute;inset:13px;border-radius:49px;overflow:hidden;background:#000}
.screen img{width:100%;height:100%;object-fit:cover;display:block}
.island{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:92px;height:28px;border-radius:16px;background:#000;z-index:2}
.btn{position:absolute;background:#2b2b2f;border-radius:3px}
.p1{left:28px;top:230px;transform:rotate(-8deg)}
.p2{left:372px;top:34px;transform:rotate(8deg)}
.p1 .btn.a{left:-5px;top:130px;width:5px;height:34px}.p1 .btn.b{left:-5px;top:180px;width:5px;height:64px}.p1 .btn.c{left:-5px;top:256px;width:5px;height:64px}.p1 .btn.d{right:-5px;top:200px;width:5px;height:96px}
.p2 .btn.a{left:-5px;top:130px;width:5px;height:34px}.p2 .btn.b{left:-5px;top:180px;width:5px;height:64px}.p2 .btn.c{left:-5px;top:256px;width:5px;height:64px}.p2 .btn.d{right:-5px;top:200px;width:5px;height:96px}
.glow{position:absolute;left:0;right:0;bottom:-6px;height:100px;background:radial-gradient(ellipse at center,rgba(206,251,105,.10),transparent 70%);pointer-events:none}
</style></head><body><div class="stage">
<div class="phone p1"><span class="btn a"></span><span class="btn b"></span><span class="btn c"></span><span class="btn d"></span><div class="island"></div><div class="screen"><img src="SCREEN1"></div></div>
<div class="phone p2"><span class="btn a"></span><span class="btn b"></span><span class="btn c"></span><span class="btn d"></span><div class="island"></div><div class="screen"><img src="SCREEN2"></div></div>
</div></body></html>
